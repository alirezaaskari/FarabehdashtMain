name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: کیفیت کد و تست
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, mbstring, fileinfo, zip, exif, gd, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: کش وابستگی‌های Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-

      - name: نصب وابستگی‌ها
        run: composer install --prefer-dist --no-interaction --no-progress

      # تست‌ها صفحه رندر می‌کنند و Blade به مانیفست Vite نیاز دارد. بدون این
      # مرحله، ۱۲ تست با «Vite manifest not found» می‌افتند — و چون public/build
      # در gitignore است، محلی سبز و روی CI قرمز می‌شوند.
      - name: نصب Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: ساخت دارایی‌ها
        # مرورگر playwright این‌جا دانلود نمی‌شود؛ مرحله «نصب Chromium» پایین‌تر
        # فقط همان یکی را با وابستگی‌های سیستمی‌اش نصب می‌کند.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci
          npm run build

      # دارایی‌های ساخته‌شده در مخزن کامیت می‌شوند تا روی هاست اشتراکی که npm
      # ندارد، یک git pull کافی باشد. پس باید مطمئن شویم همان چیزی که کامیت
      # شده، واقعاً از همین قالب‌ها ساخته شده است. اگر کسی قالبی را عوض کند و
      # npm run build نزند، سایت با کلاس‌هایی بالا می‌آید که در CSS نیستند:
      # صفحه کار می‌کند ولی بهم‌ریخته است و هیچ خطایی در لاگ نمی‌گذارد.
      - name: بررسی تازه‌بودن دارایی‌های کامیت‌شده
        run: |
          if [ -n "$(git status --porcelain public/build)" ]; then
            echo "::error::دارایی‌های کامیت‌شده با قالب‌های فعلی نمی‌خوانند."
            echo "روی کامپیوتر «npm run build» بزنید و public/build را هم کامیت کنید."
            git status --porcelain public/build
            exit 1
          fi
          echo "دارایی‌های کامیت‌شده تازه‌اند."

      - name: آماده‌سازی محیط
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: بررسی قالب کد (Pint)
        run: composer run lint

      - name: تحلیل ایستا (PHPStan)
        run: composer run analyse

      - name: تست‌ها (PHPUnit)
        run: composer run test

      # بخش ۱۷ (DEC-33): دسترس‌پذیری، ریسپانسیو، axe و پیمایش صفحه‌کلید روی
      # سرور واقعی با محتوای نمونه. بدون این مرحله، docs/architecture/accessibility.md
      # قولی می‌دهد که هیچ‌وقت اجرا نمی‌شود. دور اول صفحات عمومی (به‌اضافه یک
      # نشانی از هر فایل نقشه سایت)، دور دوم میزکار پس از ورود با رمز پیامکی
      # که درایور log در storage/logs می‌نویسد.
      - name: نصب Chromium
        run: npx playwright install --with-deps chromium

      - name: دسترس‌پذیری و صفحه‌کلید
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/a11y.sqlite
          APP_URL: http://127.0.0.1:8124
          SESSION_DRIVER: file
          CACHE_STORE: file
        run: |
          touch "$DB_DATABASE"
          php artisan migrate --force --no-interaction
          php artisan fbh:sync-tools
          php artisan fbh:seed-encyclopedia
          php artisan fbh:seed-chemicals
          php artisan fbh:links:rebuild
          php artisan serve --port=8124 > storage/logs/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8124/up > /dev/null && break; sleep 1; done
          npm run a11y
          FBH_A11Y_MOBILE=09120000017 FBH_SITEMAP=0 \
          FBH_PAGES=/workspace,/workspace/calendar,/workspace/equipment,/workspace/notifications,/workspace/profiles,/workspace/projects,/workspace/reports,/workspace/reports/new,/workspace/wallet,/pro \
            npm run a11y
